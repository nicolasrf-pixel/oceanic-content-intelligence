name = "oceanic-content-intelligence"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true

# Frontend (React/Vite) compilado en web/dist y servido por el mismo Worker.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "production"
AI_PROVIDER = "anthropic"          # anthropic | openai (compatible con /chat/completions)
AI_MODEL = "claude-sonnet-5-5"
# AI_BASE_URL = "https://api.openai.com/v1"   # solo para AI_PROVIDER=openai u otro compatible
ADMIN_EMAIL = "editor@oceanic.cl"
# Operaciones (D1, fetch, IA) por ejecucion. Plan gratuito de Workers: 50 -> 45. Con plan de pago (1000) sube a 900.
SUBREQUEST_BUDGET = "45"

[[d1_databases]]
binding = "DB"
database_name = "oceanic-content-db"
database_id = "5ca03ed6-a548-4f40-bbd3-088305252414"
migrations_dir = "migrations"

# Workers AI: motor de IA y traductor incluidos en Cloudflare (no requiere clave externa).
[ai]
binding = "AI"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "oceanic-content-media"

# Corre cada hora; el Worker decide si toca ejecutar segun la hora local de Santiago
# configurada en Ajustes (monitoring_hours_local). Asi el horario respeta el cambio de hora de Chile.
[triggers]
crons = ["0 * * * *"]

# Secretos (NO van aqui): wrangler secret put ADMIN_AUTH_SECRET | AI_API_KEY (opcional) | META_ACCESS_TOKEN | META_IG_USER_ID | YOUTUBE_API_KEY (opcionales)
